name: Build SportsCal feeds

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 6am ET / 5am EDT
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_calendars.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # Commit a heartbeat file so the repo has recent activity — GitHub
      # otherwise auto-disables scheduled workflows after 60 days of silence.
      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-build.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-build.txt
          git diff --cached --quiet || git commit -m "chore: heartbeat $(cat .github/last-build.txt)"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
